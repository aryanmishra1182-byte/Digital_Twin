server:
  port: 8080

spring:
  application:
    name: motor-digital-twin-backend
  profiles:
    active: dev

  datasource:
    url: jdbc:h2:mem:motortwindb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driverClassName: org.h2.Driver
    username: sa
    password: 
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

# ML Python Service Integration configuration
ml:
  service:
    url: ${ML_SERVICE_URL:http://localhost:8001}
    timeout-ms: 5000
    mock-fallback-enabled: false

# MQTT Configuration
mqtt:
  enabled: ${MQTT_ENABLED:false}
  broker-url: ${MQTT_BROKER_URL:tcp://localhost:1883}
  client-id: ${MQTT_CLIENT_ID:motor-twin-backend}
  topics:
    telemetry: motors/+/telemetry
    alerts: motors/+/alerts

# Actuator / Management endpoints
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

# OpenAPI doc
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
